[package]
name = "mendimaru"
version = "0.4.2"
description = "Manage Mendix Studio Pro natively on Windows or through WinBoat on Linux"
authors = ["mendimaru contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mendimaru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
aho-corasick = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = "0.3"
walkdir = "2"
regex = "1"
percent-encoding = "2"
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
chromiumoxide = "0.9"
scraper = "0.27"
base64 = "0.22"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
icu_datetime = { version = "2.2", features = ["compiled_data"] }
icu_decimal = { version = "2.2", features = ["compiled_data"] }
icu_locale = "2.2"
writeable = "0.6"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
tempfile = "3"
flate2 = "1"
fs2 = "0.4"
tar = "0.4"
zeroize = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
