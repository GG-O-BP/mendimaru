[package]
name = "mendimaru"
version = "0.1.0"
description = "Manage Mendix Studio Pro on Linux through WinBoat"
authors = ["mendimaru contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mendimaru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time"] }
futures-util = "0.3"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = "0.9"
scraper = "0.27"
base64 = "0.22"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
icu_datetime = { version = "2.2", features = ["compiled_data"] }
icu_decimal = { version = "2.2", features = ["compiled_data"] }
icu_locale = "2.2"
writeable = "0.6"

[dev-dependencies]
tempfile = "3"
