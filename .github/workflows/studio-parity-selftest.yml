name: Studio F5 parity gate self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-environment:
    name: Restore configured WinBoat readiness
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 15
    steps:
      - name: Diagnose and ensure the configured VM
        run: |
          xvfb-run -a python3 -u - <<'PYTHON'
          import json,os,stat,subprocess
          from pathlib import Path
          home=Path.home()
          binary=Path(os.environ['GITHUB_WORKSPACE'])/'src-tauri/target/release/mendimaru'
          config=json.loads((home/'.config/com.ggobp.mendimaru/config.json').read_text())
          print('Configured VM:',{k:config.get(k) for k in ['containerName','composeFile','sharedDirectory','rdpHost','rdpPort','startupTimeoutSeconds']},flush=True)
          for args in [['docker','ps','-a','--format','{{.Names}} {{.Status}} {{.Ports}}'],['docker','compose','-f',config['composeFile'],'config','--quiet']]:
           p=subprocess.run(args,capture_output=True,text=True,timeout=45)
           print('Docker diagnosis:',args[:2],p.returncode,p.stdout,p.stderr,flush=True)
          for args in [['env','status'],['env','ensure'],['env','status']]:
           p=subprocess.run([str(binary),*args,'--json','--timeout-seconds','300'],capture_output=True,text=True,timeout=330)
           print('VM readiness:',args,p.returncode,p.stdout or p.stderr,flush=True)
          root=home/'.cache/com.ggobp.mendimaru/winboat-runtime/sessions'
          for path in root.glob('*/session.json'):
           d=json.loads(path.read_text())
           if str(d.get('startedAt','')).startswith('2026-10-13'):
            print('Current record:',{k:d.get(k) for k in ['sessionId','state','studioSessionId','studioState','failureCode']},flush=True)
            for line in (path.parent/'runtime.log').read_text().splitlines()[-10:] if (path.parent/'runtime.log').exists() else []:print('Runtime log:',line,flush=True)
          PYTHON
