name: Studio F5 parity gate self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-environment:
    name: Verify winboat-studio runner prerequisites
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Verify toolchain, Docker, and the parity suite
        env:
          STUDIO_F5_PARITY_SUITE: ${{ vars.STUDIO_F5_PARITY_SUITE }}
        run: |
          test -x /usr/bin/cargo
          cargo --version
          docker ps --format '{{.Names}}'
          test -n "$STUDIO_F5_PARITY_SUITE"
          test -f "$STUDIO_F5_PARITY_SUITE"
          SUITE="$STUDIO_F5_PARITY_SUITE" node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { validateSuiteShape } from "./scripts/e2e/studio-f5-parity-gate.mjs";
            const suite = JSON.parse(await readFile(process.env.SUITE, "utf8"));
            validateSuiteShape(suite, process.env.SUITE);
            console.log("parity suite validation: OK");
          '

      - name: Diagnose release gate prerequisites without mutations
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { existsSync, readdirSync } from 'node:fs';
          const binary = '/usr/bin/mendimaru';
          console.log('release binary exists:', existsSync(binary));
          for (const key of ['MENDIMARU_CONFIG_DIR', 'MENDIMARU_CACHE_DIR', 'MENDIMARU_STUDIO_PARITY_SHARED_SESSION_ID', 'DISPLAY', 'WAYLAND_DISPLAY']) console.log(key, process.env[key] ?? '(unset)');
          for (const root of [`${process.env.HOME}/.config`, `${process.env.HOME}/.cache`, `${process.env.HOME}/.config/mendimaru-gates`]) {
            if (existsSync(root)) console.log('candidate directories:', root, readdirSync(root).filter(name => root.endsWith('mendimaru-gates') || /mendimaru/i.test(name)));
          }
          function safe(value) {
            if (Array.isArray(value)) return value.map(safe);
            if (!value || typeof value !== 'object') return value;
            const allow = new Set(['schemaVersion','command','ok','platform','backend','error','code','message','retryable','data','state','status','sessionId','runtimeSessionId','studioSessionId','preparationId','comparable','mode','httpReady','studioState','sessions','runtimes','checks','available','healthy','connected','ready','installed','kind','name','passed','identity','runtimeMode','preparation','tools','configured','prerequisites','reasons','diagnostics','label','detail','id','title','summary','health','connectivity','guestReady']);
            return Object.fromEntries(Object.entries(value).filter(([key]) => allow.has(key)).map(([key,v])=>[key,safe(v)]));
          }
          for (const args of [['env','status'], ['runtime','list'], ['studio','status'], ['browser','doctor'], ['project','list'], ['runtime','start','--mode','studio-run-locally']]) {
            const result = spawnSync(binary, [...args,'--json','--timeout-seconds','30'], {encoding:'utf8',timeout:45000,maxBuffer:1048576});
            console.log('command:', args.join(' '), 'exit:', result.status, 'spawn error:', result.error?.message ?? null);
            if (result.stdout) { try { console.log(JSON.stringify(safe(JSON.parse(result.stdout)))); } catch { console.log('non-JSON stdout bytes:', Buffer.byteLength(result.stdout)); } }
            if (result.stderr) console.log('stderr:', result.stderr.slice(0,2000));
          }
          JS

      - name: Inspect dormant fixture locations
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          find "$HOME" -maxdepth 4 -type d \( -name '*149*' -o -name '*parity*' -o -name '*mendimaru*' \) -print
          find "$HOME/.cache/com.ggobp.mendimaru" -maxdepth 3 -type f -name '*session*.json' -printf '%P\n' 2>/dev/null || true
          command -v mendimaru || true

      - name: Locate safe operator fixture metadata
        run: |
          command -v Xvfb xvfb-run xfreerdp3 || true
          pacman -Q mendimaru || true
          python3 - <<'PYTHON'
          import os, json
          from pathlib import Path
          home=Path.home()
          config=home/'.config/com.ggobp.mendimaru/config.json'
          if config.is_file():
            data=json.loads(config.read_text())
            print('default configuration:', {k:data.get(k) for k in ['containerName','composeFile','sharedDirectory','freerdpBinary']})
          for root,dirs,files in os.walk(home/'Workspaces/mendix'):
            dirs[:]=[d for d in dirs if d not in ['.git','node_modules','target','.venv']]
            for name in dirs+files:
              if any(word in name.lower() for word in ['149','parity','cold-copy']): print('fixture:',Path(root)/name)
          PYTHON

      - name: Inspect retained parity lab and runner environment
        run: |
          python3 - <<'PYTHON'
          import os, json
          from pathlib import Path
          allowed=['MENDIMARU_CONFIG_DIR','MENDIMARU_CACHE_DIR','MENDIMARU_STUDIO_PARITY_SHARED_SESSION_ID']
          env=Path.home()/'actions-runner/.env'
          if env.is_file():
            for line in env.read_text().splitlines():
              if line.split('=',1)[0] in allowed: print('runner setting:',line)
          for base in [Path('/tmp'),Path.home()]:
            for root,dirs,files in os.walk(base):
              dirs[:]=[d for d in dirs if d not in ['.git','node_modules','target','.venv','.cargo','.npm','glendix-family','mxcli-family','pantos','pantos-demo','yarn','go','rustup']]
              for name in dirs:
                if any(word in name.lower() for word in ['149','parity','cold-copy']): print('retained lab:',Path(root)/name)
              if 'config.json' in files and ('149' in root.lower() or 'parity' in root.lower()):
                try:
                  data=json.loads((Path(root)/'config.json').read_text())
                  print('lab configuration:',root,{k:data.get(k) for k in ['containerName','composeFile','sharedDirectory']})
                except Exception: pass
          suite=Path(os.environ['HOME'])/'.config/mendimaru-gates/studio-f5-parity.browser.json'
          data=json.loads(suite.read_text())
          print('suite tests:',[{ 'name':test.get('name'), 'actions':[step.get('action') for step in test.get('steps',[])]} for test in data.get('tests',[])])
          PYTHON
