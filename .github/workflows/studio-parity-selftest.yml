name: Studio F5 parity gate self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-environment:
    name: Inspect the selected Studio RemoteApp window
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 15
    steps:
      - name: Inspect the actual project window title
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -u - <<'PYTHON'
          import json, os, subprocess, time
          from pathlib import Path
          binary=Path(os.environ['GITHUB_WORKSPACE'])/'src-tauri/target/release/mendimaru'
          owned=None
          def cli(*args):
              p=subprocess.run([str(binary),*args,'--json'],capture_output=True,text=True,timeout=420)
              d=json.loads(p.stdout or p.stderr)
              print('CLI:',args,p.returncode,json.dumps(d),flush=True)
              assert p.returncode==0 and d.get('ok')
              return d
          try:
              assert cli('studio','status','--refresh','--timeout-seconds','90')['data']==[]
              for runtime in cli('runtime','list')['data']['sessions']:
                  if runtime.get('studioSessionId')=='studio-6980-639274728135495413' and runtime['state']!='stopped':
                      cli('runtime','stop','--session-id',runtime['sessionId'],'--timeout-seconds','120')
              projects=cli('project','list')['data']
              project=next(p for p in projects if p['name']=='IronCalcSpreadUIShowcase')
              owned=cli('studio','start','--version',project['requiredVersion'],'--project-id',project['projectId'],'--timeout-seconds','360')['studioSessionId']
              for i in range(6):
                  p=subprocess.run(['xdotool','search','--onlyvisible','--name','.'],capture_output=True,text=True,timeout=15)
                  titles=[]
                  for wid in p.stdout.splitlines()[:30]:
                      title=subprocess.run(['xdotool','getwindowname',wid],capture_output=True,text=True,timeout=10).stdout.strip()
                      titles.append((wid,title))
                  print('Visible RemoteApp windows:',json.dumps(titles),flush=True)
                  time.sleep(10)
          finally:
              if owned:
                  cli('studio','stop','--session-id',owned,'--timeout-seconds','120')
                  for runtime in cli('runtime','list')['data']['sessions']:
                      if runtime.get('studioSessionId')==owned and runtime['state']!='stopped':
                          cli('runtime','stop','--session-id',runtime['sessionId'],'--timeout-seconds','120')
          PYTHON
