name: Studio F5 parity gate self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-environment:
    name: Repair the configured Compose service lifecycle
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 15
    steps:
      - name: Inspect and repair the idle configured service
        run: |
          xvfb-run -a python3 -u - <<'PYTHON'
          import json,os,subprocess
          from pathlib import Path
          home=Path.home()
          binary=Path(os.environ['GITHUB_WORKSPACE'])/'src-tauri/target/release/mendimaru'
          config=json.loads((home/'.config/com.ggobp.mendimaru/config.json').read_text())
          assert config['containerName']=='WinBoat'
          def cli(*args):
           p=subprocess.run([str(binary),*args,'--json','--timeout-seconds','300'],capture_output=True,text=True,timeout=330)
           d=json.loads(p.stdout or p.stderr)
           print('CLI:',args,p.returncode,json.dumps(d),flush=True)
           assert p.returncode==0 and d.get('ok')
           return d
          assert cli('studio','status','--refresh')['data']==[]
          assert all(s['state'] in ['stopped','failed'] for s in cli('runtime','list')['data']['sessions'])
          command=['docker','compose','-f',config['composeFile']]
          services=subprocess.check_output([*command,'config','--services'],text=True,timeout=30).splitlines()
          assert len(services)==1
          p=subprocess.run([*command,'up','-d','--force-recreate',services[0]],capture_output=True,text=True,timeout=120)
          print('Actual Compose recreate:',p.returncode,p.stdout,p.stderr,flush=True)
          if p.returncode:
           print('Rebuilding only the configured Compose service; persistent storage is retained',flush=True)
           p=subprocess.run([*command,'down'],capture_output=True,text=True,timeout=120)
           print('Compose service down:',p.returncode,p.stdout,p.stderr,flush=True)
           assert p.returncode==0
           p=subprocess.run([*command,'up','-d',services[0]],capture_output=True,text=True,timeout=120)
           print('Compose service up:',p.returncode,p.stdout,p.stderr,flush=True)
           assert p.returncode==0
          assert cli('env','ensure')['data']['ready']
          print('Configured VM is ready for the next preparation',flush=True)
          PYTHON
