name: Studio F5 parity gate self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-environment:
    name: Verify winboat-studio runner prerequisites
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: v0.6.1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
      - name: Inspect installed Studio and parity sample without modifying it
        run: |
          xvfb-run -a python3 -u - <<'PYTHON'
          import json, subprocess
          for args in [['env','status'],['studio','list'],['project','list']]:
            proc=subprocess.run(['/usr/bin/mendimaru',*args,'--json','--timeout-seconds','120'],text=True,capture_output=True,timeout=150)
            data=json.loads(proc.stdout or proc.stderr)
            if args==['project','list'] and data.get('ok'):
              data['data']=[entry for entry in data['data'] if entry.get('name')=='IronCalcSpreadUIShowcase']
            print('operator prerequisites:',args,proc.returncode,json.dumps(data),flush=True)
          PYTHON
      - name: Verify live Studio and application readiness
        run: |
          docker port WinBoat
          xvfb-run -a python3 -u - <<'PYTHON'
          import json, subprocess
          proc=subprocess.run(['/usr/bin/mendimaru','studio','status','--refresh','--json','--timeout-seconds','90'],text=True,capture_output=True,timeout=120)
          print('live Studio status:',proc.returncode,proc.stdout.strip() or proc.stderr.strip())
          proc=subprocess.run(['curl','--max-time','5','-s','-o','/dev/null','-w','%{http_code}','http://127.0.0.1:8080/'],text=True,capture_output=True,timeout=10)
          print('host Runtime readiness:',proc.returncode,proc.stdout.strip())
          PYTHON
