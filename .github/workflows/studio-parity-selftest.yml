name: Studio F5 parity gate self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-environment:
    name: Verify winboat-studio runner prerequisites
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: v0.6.1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
      - name: Install frontend dependencies
        run: npm ci
      - name: Build the Linux release binary exactly like the release gate
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Reproduce the release gate's first command with its stderr
        env:
          GATE_BINARY: ${{ github.workspace }}/src-tauri/target/release/mendimaru
        run: |
          docker port WinBoat
          python3 -u - <<'PYTHON'
          import json, os, subprocess
          binary=os.environ['GATE_BINARY']
          home=os.environ['HOME']
          def attempt(prefix,label):
            proc=subprocess.run([*prefix,binary,'runtime','start','--mode','studio-run-locally','--json','--timeout-seconds','90'],text=True,capture_output=True,timeout=150)
            print(label,'exit:',proc.returncode,'stdout bytes:',len(proc.stdout),flush=True)
            print(label,'stdout:',proc.stdout.replace(home,'~')[:3000],flush=True)
            print(label,'stderr:',proc.stderr.replace(home,'~')[:3000],flush=True)
            try:
              envelope=json.loads(proc.stdout)
            except Exception:
              return False
            session=envelope.get('runtimeSessionId') or ((envelope.get('data') or {}).get('runtime') or {}).get('sessionId')
            if session:
              stop=subprocess.run([binary,'runtime','stop','--session-id',session,'--json'],text=True,capture_output=True,timeout=150)
              print(label,'cleanup exit:',stop.returncode,stop.stdout.replace(home,'~')[:1500],flush=True)
            return True
          if not attempt([],'headless'):
            attempt(['xvfb-run','-a'],'xvfb')
          PYTHON
          docker port WinBoat
