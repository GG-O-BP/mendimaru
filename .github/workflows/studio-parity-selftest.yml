name: Studio F5 parity gate self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-environment:
    name: Verify winboat-studio runner prerequisites
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Verify toolchain and the configured parity fixture
        env:
          MENDIMARU_STUDIO_PARITY_PROJECT_PATH: ${{ vars.STUDIO_F5_PARITY_PROJECT_PATH }}
          MENDIMARU_STUDIO_PARITY_VERSION: ${{ vars.STUDIO_F5_PARITY_VERSION }}
          MENDIMARU_STUDIO_PARITY_SUITE: ${{ vars.STUDIO_F5_PARITY_SUITE }}
        run: |
          command -v cargo
          cargo --version
          command -v xvfb-run
          command -v xdotool
          python3 scripts/e2e/prepare-studio-f5-release.py --check-fixture
