name: Studio F5 parity gate self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-environment:
    name: Verify winboat-studio runner prerequisites
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: v0.6.1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
      - name: Inspect how the runner loads job environment (names only)
        run: |
          python3 -u - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          root=Path.home()/'actions-runner'
          for name in ['.env','.path']:
            path=root/name
            if path.is_file():
              keys=[line.split('=',1)[0] for line in path.read_text().splitlines() if '=' in line]
              print('runner',name,'keys:',keys if name=='.env' else '(path file present)')
          print('hook variables:',{k:bool(v) for k,v in os.environ.items() if k.startswith('ACTIONS_RUNNER_HOOK')})
          print('parity env present:',{k:k in os.environ for k in ['MENDIMARU_STUDIO_PARITY_SHARED_SESSION_ID','MENDIMARU_CONFIG_DIR','MENDIMARU_CACHE_DIR','DISPLAY']})
          print('runner parent chain:')
          pid=os.getppid()
          for _ in range(8):
            try:
              cmd=Path(f'/proc/{pid}/cmdline').read_bytes().replace(b'\0',b' ').decode()[:160]
              stat=Path(f'/proc/{pid}/stat').read_text().split()
            except Exception: break
            print(' ',pid,cmd.replace(str(Path.home()),'~'))
            pid=int(stat[3])
            if pid<=1: break
          for unit in subprocess.run(['systemctl','list-units','--all','--no-legend','actions.runner*'],text=True,capture_output=True).stdout.splitlines(): print('system unit:',unit)
          for unit in subprocess.run(['systemctl','--user','list-units','--all','--no-legend','actions.runner*'],text=True,capture_output=True).stdout.splitlines(): print('user unit:',unit)
          print('displays:',sorted(p.name for p in Path('/tmp/.X11-unix').glob('X*')) if Path('/tmp/.X11-unix').exists() else [])
          PYTHON
          /usr/bin/mendimaru runtime list --json | python3 -c "import json,sys; d=json.load(sys.stdin); print('runtime records:',[(s.get('sessionId'),s.get('state'),s.get('studioState'),s.get('incompatibleRecord')) for s in d['data']['sessions']])"
