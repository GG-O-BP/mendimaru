name: Release Windows installers and publish AUR package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string
      publish:
        description: Push the generated package to AUR
        required: true
        default: false
        type: boolean
      initialize_empty:
        description: Allow the first commit to an empty AUR repository
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  verify-aur:
    uses: ./.github/workflows/aur-package.yml
    with:
      ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Run dependency audit action
        uses: ./actions/dependency-audit

  verify-windows:
    name: Verify Windows release candidate
    needs: dependency-audit
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint, formatting, builds, and tests
        run: |
          npm run check:portable
          npm run test:e2e:windows:powershell
          npm run lint:rust:all-features

      - name: Run actual Tauri, WebView2, IPC, Windows, and performance E2E
        run: npm run test:e2e:windows
        env:
          MENDIMARU_E2E_MAX_STARTUP_MS: 180000

      - name: Upload native E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-release-windows-native-e2e
          path: artifacts/e2e
          if-no-files-found: warn

  studio-f5-parity:
    name: Studio F5 to Linux Chrome parity gate
    needs: dependency-audit
    runs-on: [self-hosted, linux, winboat-studio]
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Linux release binary
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Run the shared-project Studio F5 parity gate
        env:
          MENDIMARU_STUDIO_PARITY_BINARY: ${{ github.workspace }}/src-tauri/target/release/mendimaru
          MENDIMARU_STUDIO_PARITY_SUITE: ${{ vars.STUDIO_F5_PARITY_SUITE }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -u - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.request
          from pathlib import Path

          binary = os.environ["MENDIMARU_STUDIO_PARITY_BINARY"]
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          studio_id = None
          shared_id = None
          watcher = None
          watcher_log = None


          def cli(*args, timeout=150):
              print("CLI:", " ".join(args), flush=True)
              p = subprocess.run(
                  [binary, *args, "--json"],
                  text=True, capture_output=True, timeout=timeout,
              )
              try:
                  envelope = json.loads(p.stdout)
              except ValueError as error:
                  raise RuntimeError(
                      f"{args[:2]} returned no JSON: exit={p.returncode}, "
                      f"stderr={p.stderr[:1200]}"
                  ) from error
              if p.returncode != 0 or not envelope.get("ok"):
                  raise RuntimeError(f"{args[:2]} failed: {envelope.get('error')}")
              return envelope


          def build_generation(project):
              generation = hashlib.sha256()
              count = 0
              for root in [project / "deployment/web", project / "deployment/model"]:
                  if not root.is_dir():
                      continue
                  for p in sorted(root.rglob("*")):
                      if not p.is_file() or p.is_symlink():
                          continue
                      stat = p.stat()
                      generation.update(
                          f"{p.relative_to(project)}:{stat.st_size}:{stat.st_mtime_ns}\n".encode()
                      )
                      count += 1
              assert count > 0, "Studio has no generated build files"
              return generation.hexdigest()


          try:
              existing = cli("studio", "status", "--refresh", "--timeout-seconds", "90")
              assert not existing["data"], "The release fixture already has an active Studio owner"
              projects = cli("project", "list")["data"]
              matches = [p for p in projects if p["name"] == "IronCalcSpreadUIShowcase"]
              assert len(matches) == 1, "The configured release project must be unique"
              project = matches[0]
              assert project["requiredVersion"] == "11.12.3", "Unexpected release fixture version"
              assert any(p["version"] == project["requiredVersion"] for p in cli("studio", "list")["data"])
              config = json.loads((Path.home() / ".config/com.ggobp.mendimaru/config.json").read_text())
              assert config["containerName"] == "WinBoat", "Unexpected release VM"
              share = Path(config["sharedDirectory"])
              candidates = []
              for root, dirs, files in os.walk(share):
                  depth = len(Path(root).relative_to(share).parts)
                  dirs[:] = [
                      d for d in dirs if depth < 5
                      and d not in [".git", "node_modules", "deployment", "target", ".gradle"]
                  ]
                  if "IronCalcSpreadUIShowcase.mpr" in files:
                      candidates.append(Path(root))
              assert len(candidates) == 1, "The release project's build tree must be unique"
              project_directory = candidates[0]

              # The documented UNC repair changes only generated bundler inputs. The
              # actual release decision still requires an unmodified Chromium pass.
              watcher_log = (workspace / "artifacts/e2e/release-asset-watcher.ndjson")
              watcher_log.parent.mkdir(parents=True, exist_ok=True)
              watcher_output = watcher_log.open("w")
              watcher = subprocess.Popen(
                  [binary, "assets", "watch", "--project-id", project["projectId"],
                   "--rewrite-generated-assets"],
                  stdout=watcher_output, stderr=subprocess.STDOUT,
              )
              time.sleep(1)
              assert watcher.poll() is None, "The generated-asset watcher failed to start"

              launched = cli(
                  "studio", "start", "--version", project["requiredVersion"],
                  "--project-id", project["projectId"], "--timeout-seconds", "360",
                  timeout=390,
              )
              studio_id = launched.get("studioSessionId")
              assert studio_id and re.fullmatch(r"studio-\d+-\d{18}", studio_id)
              print("Owned Studio:", studio_id, flush=True)

              # This exact fixture uses Studio 11.12.3. Its UIA adapter is not enabled,
              # so send the ordinary F5 key to its visible, uniquely named RemoteApp.
              window = None
              deadline = time.monotonic() + 180
              while time.monotonic() < deadline:
                  p = subprocess.run(
                      ["xdotool", "search", "--onlyvisible", "--name", "IronCalcSpreadUIShowcase"],
                      text=True, capture_output=True, timeout=10,
                  )
                  observed = []
                  for wid in p.stdout.splitlines():
                      title = subprocess.check_output(
                          ["xdotool", "getwindowname", wid], text=True, timeout=10,
                      ).strip()
                      if "IronCalcSpreadUIShowcase" in title and "Studio Pro" in title:
                          observed.append((wid, title))
                  if len(observed) == 1:
                      window, title = observed[0]
                      print("Studio project window:", title, flush=True)
                      break
                  print("Waiting for the selected project window", flush=True)
                  time.sleep(5)
              assert window, "The exact project's visible RemoteApp window did not appear"
              print("Allowing project load to settle before F5", flush=True)
              time.sleep(30)
              subprocess.run(["xdotool", "windowfocus", "--sync", window], check=True, timeout=15)
              subprocess.run(["xdotool", "key", "--clearmodifiers", "F5"], check=True, timeout=15)
              print("Delivered ordinary Studio F5", flush=True)

              runtime = cli(
                  "runtime", "start", "--mode", "studio-run-locally",
                  "--studio-session-id", studio_id, "--timeout-seconds", "600",
                  timeout=630,
              )
              runtime_id = runtime["runtimeSessionId"]
              ready = cli(
                  "runtime", "wait", "--session-id", runtime_id,
                  "--timeout-seconds", "600", timeout=630,
              )["data"]
              # runtime.wait exposes the RuntimeStatus directly.
              if "runtime" in ready:
                  ready = ready["runtime"]
              assert ready["state"] == "ready" and ready["httpReady"]
              print("Studio Runtime is HTTP-ready:", runtime_id, flush=True)
              with urllib.request.urlopen(ready["url"], timeout=30) as response:
                  assert response.status < 500
                  response.read()

              previous = None
              stable_since = None
              deadline = time.monotonic() + 240
              while time.monotonic() < deadline:
                  assert watcher.poll() is None, "The generated-asset watcher stopped"
                  current = build_generation(project_directory)
                  if current != previous:
                      previous = current
                      stable_since = time.monotonic()
                  elif time.monotonic() - stable_since >= 20:
                      break
                  print("Waiting for generated build files to settle", flush=True)
                  time.sleep(5)
              else:
                  raise RuntimeError("Studio's generated files did not stabilize")
              marker = Path(os.environ["RUNNER_TEMP"]) / "mendimaru-v061-build-generation"
              marker.write_text(previous + "\n")
              descriptor = cli(
                  "browser", "session", "prepare", "--runtime-session-id", runtime_id,
                  "--build-marker", str(marker),
              )["data"]
              shared_id = descriptor["sessionId"]
              assert descriptor["state"] == "ready"
              assert descriptor["preparation"]["comparable"] is True
              print("Prepared comparable shared session:", shared_id, flush=True)
              gate_env = os.environ.copy()
              gate_env["MENDIMARU_STUDIO_PARITY_SHARED_SESSION_ID"] = shared_id
              subprocess.run(
                  ["node", "scripts/e2e/studio-f5-parity-gate.mjs"],
                  env=gate_env, check=True, timeout=1320,
              )
              assert build_generation(project_directory) == previous, "The build changed during parity verification"
          finally:
              primary_failure = sys.exc_info()[0] is not None
              cleanup_failures = []
              if shared_id:
                  try:
                      cli("browser", "session", "finalize", "--shared-session-id", shared_id)
                  except Exception as error:
                      cleanup_failures.append(error)
              if studio_id:
                  try:
                      cli("studio", "stop", "--session-id", studio_id, "--timeout-seconds", "120", timeout=150)
                  except Exception as error:
                      cleanup_failures.append(error)
              if watcher is not None:
                  try:
                      watcher.terminate()
                      watcher.wait(timeout=20)
                      watcher_output.close()
                      print("Generated-asset watcher stopped", flush=True)
                  except Exception as error:
                      cleanup_failures.append(error)
              for error in cleanup_failures:
                  print("Owner cleanup error:", error, flush=True)
              if cleanup_failures and not primary_failure:
                  raise cleanup_failures[0]
          PYTHON

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-studio-f5-parity-evidence
          path: artifacts/e2e/studio-f5-parity.json
          if-no-files-found: warn

  release:
    name: Create GitHub release
    needs: [verify-windows, verify-aur, studio-f5-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify release versions
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "::error::Release tags must use v-prefixed semantic versions."
            exit 1
          fi

          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(
            sed -n -E 's/^version = "([^"]+)"$/\1/p' \
              src-tauri/Cargo.toml | head -n 1
          )"

          for declared in \
            "$package_version" \
            "$tauri_version" \
            "$cargo_version"; do
            if [[ "$declared" != "$version" ]]; then
              echo "::error::Declared version '$declared' does not match '$version'."
              exit 1
            fi
          done

      - name: Create GitHub release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Mendimaru ${RELEASE_TAG#v}" \
              --generate-notes
          fi

  publish-aur:
    name: Publish mendimaru to AUR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    env:
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      INITIALIZE_EMPTY: ${{ github.event_name == 'push' && vars.AUR_INITIALIZE_EMPTY == 'true' || inputs.initialize_empty }}
      AUR_PACKAGE_NAME: mendimaru
    steps:
      - name: Install workflow dependencies
        run: |
          pacman -Syu --noconfirm git openssh curl jq
          useradd --create-home --shell /bin/bash aurbuild

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Prepare non-root build user
        run: install -d -o aurbuild -g aurbuild "$RUNNER_TEMP/aur"

      - name: Configure AUR identity
        if: env.SHOULD_PUBLISH == 'true'
        env:
          AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL }}
          AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Repository secret AUR_SSH_PRIVATE_KEY is not configured."
            exit 1
          fi

          install -d -m 700 -o aurbuild -g aurbuild /home/aurbuild/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" |
            tr -d '\r' > /home/aurbuild/.ssh/aur
          ssh-keyscan -T 15 -t ed25519 aur.archlinux.org \
            > /home/aurbuild/.ssh/known_hosts

          expected_fingerprint="SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
          mapfile -t actual_fingerprints < <(
            ssh-keygen -E sha256 -lf /home/aurbuild/.ssh/known_hosts |
              awk '{ print $2 }' |
              sort -u
          )
          if (( ${#actual_fingerprints[@]} != 1 )) ||
            [[ "${actual_fingerprints[0]}" != "$expected_fingerprint" ]]; then
            echo "::error::Unexpected aur.archlinux.org SSH host key."
            exit 1
          fi

          chown aurbuild:aurbuild \
            /home/aurbuild/.ssh/aur \
            /home/aurbuild/.ssh/known_hosts
          chmod 600 \
            /home/aurbuild/.ssh/aur \
            /home/aurbuild/.ssh/known_hosts

          printf '%s\n' \
            'Host aur.archlinux.org' \
            '  User aur' \
            '  IdentityFile ~/.ssh/aur' \
            '  IdentitiesOnly yes' \
            > /home/aurbuild/.ssh/config
          chown aurbuild:aurbuild /home/aurbuild/.ssh/config
          chmod 600 /home/aurbuild/.ssh/config

          runuser -u aurbuild -- env HOME=/home/aurbuild \
            git config --global user.name \
            "${AUR_GIT_NAME:-Mendimaru release automation}"
          runuser -u aurbuild -- env HOME=/home/aurbuild \
            git config --global user.email \
            "${AUR_GIT_EMAIL:-actions@users.noreply.github.com}"

      - name: Prepare, validate, and publish AUR package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(
            --tag "$RELEASE_TAG"
            --work-dir "$RUNNER_TEMP/aur"
            --verify-source
          )

          if [[ "$SHOULD_PUBLISH" == "true" ]]; then
            if [[ "$INITIALIZE_EMPTY" == "true" ]]; then
              args+=(--initialize-empty)
            fi
            args+=(--push)
          else
            args+=(--offline)
          fi

          runuser -u aurbuild -- env \
            HOME=/home/aurbuild \
            PATH="$PATH" \
            AUR_PACKAGE_NAME="$AUR_PACKAGE_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_TOKEN="$GITHUB_TOKEN" \
            bash scripts/update-mendimaru-aur.sh "${args[@]}"

      - name: Upload dry-run AUR files
        if: env.SHOULD_PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-${{ env.RELEASE_TAG }}
          path: |
            ${{ runner.temp }}/aur/mendimaru/PKGBUILD
            ${{ runner.temp }}/aur/mendimaru/.SRCINFO
          if-no-files-found: error

  publish-windows:
    name: Build and publish Windows installers
    needs: release
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure optional Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace(
            $env:WINDOWS_CERTIFICATE
          )
          $hasPassword = -not [string]::IsNullOrWhiteSpace(
            $env:WINDOWS_CERTIFICATE_PASSWORD
          )
          $hasTimestamp = -not [string]::IsNullOrWhiteSpace(
            $env:WINDOWS_TIMESTAMP_URL
          )
          $configuredCount = @(
            @(
              $hasCertificate
              $hasPassword
              $hasTimestamp
            ) | Where-Object { $_ }
          ).Count

          if ($configuredCount -eq 0) {
            "WINDOWS_SIGNING_ENABLED=false" >> $env:GITHUB_ENV
            $noticePath = Join-Path `
              $env:RUNNER_TEMP `
              "WINDOWS-BUILDS-UNSIGNED.txt"
            @"
          Mendimaru $env:RELEASE_TAG Windows build notice

          The MSI and NSIS installers in this release are not Authenticode
          signed. Windows SmartScreen may display an unknown-publisher warning.

          These artifacts were built by the repository's GitHub Actions release
          workflow and passed the isolated install, native-window launch,
          performance, and uninstall lifecycle checks.
          "@ | Set-Content -LiteralPath $noticePath -Encoding utf8
            "WINDOWS_UNSIGNED_NOTICE_PATH=$noticePath" >> $env:GITHUB_ENV
            Write-Warning "Publishing explicitly marked unsigned Windows installers."
            exit 0
          }

          if ($configuredCount -ne 3) {
            throw @"
          Windows signing is only partially configured. Set all of
          WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD, and
          WINDOWS_TIMESTAMP_URL, or remove all three to publish explicitly
          marked unsigned installers.
          "@
          }

          $timestamp = $null
          if (
            -not [Uri]::TryCreate(
              $env:WINDOWS_TIMESTAMP_URL,
              [UriKind]::Absolute,
              [ref]$timestamp
            ) -or
            $timestamp.Scheme -notin @("http", "https")
          ) {
            throw "Repository variable WINDOWS_TIMESTAMP_URL must be an absolute HTTP(S) timestamp URL."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "mendimaru-signing.pfx"
          $configPath = Join-Path $env:RUNNER_TEMP "mendimaru-windows-signing.json"
          "WINDOWS_SIGNING_ENABLED=true" >> $env:GITHUB_ENV
          "TAURI_WINDOWS_SIGNING_CONFIG=$configPath" >> $env:GITHUB_ENV
          "MENDIMARU_WINDOWS_CERTIFICATE_PATH=$pfxPath" >> $env:GITHUB_ENV
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText -Force
          $importedCertificates = @(
            Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password `
              -Exportable:$false
          )
          "MENDIMARU_WINDOWS_IMPORTED_THUMBPRINTS=$($importedCertificates.Thumbprint -join ',')" >> $env:GITHUB_ENV
          $signingCertificates = @(
            $importedCertificates | Where-Object { $_.HasPrivateKey }
          )
          if ($signingCertificates.Count -ne 1) {
            throw "The PFX must contain exactly one Windows code-signing certificate with a private key."
          }
          $certificate = $signingCertificates[0]
          "MENDIMARU_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          if ($certificate.NotAfter -le [DateTime]::UtcNow.AddDays(7)) {
            throw "Windows signing certificate is expired or expires within seven days."
          }

          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $timestamp.AbsoluteUri
              }
            }
          } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath $configPath -Encoding utf8

      - name: Build MSI and NSIS installers
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_ENABLED -eq "true") {
            npm run tauri -- build --bundles msi,nsis `
              --config "$env:TAURI_WINDOWS_SIGNING_CONFIG"
          }
          else {
            npm run tauri -- build --bundles msi,nsis
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri Windows bundle build failed with exit code $LASTEXITCODE."
          }

      - name: Verify Authenticode on application and installers
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $artifacts = @(
            Get-Item "src-tauri/target/release/mendimaru.exe" -ErrorAction Stop
            Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
            Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          )
          if ($artifacts.Count -lt 3) {
            throw "Expected the application executable plus MSI and NSIS installers."
          }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne [Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($artifact.FullName): $($signature.StatusMessage)"
            }
            if (
              $signature.SignerCertificate.Thumbprint -ne
              $env:MENDIMARU_WINDOWS_CERTIFICATE_THUMBPRINT
            ) {
              throw "Unexpected signing certificate on $($artifact.FullName)."
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing trusted timestamp on $($artifact.FullName)."
            }
          }

      - name: Install, launch, and uninstall MSI in the ephemeral VM
        shell: pwsh
        env:
          MENDIMARU_EPHEMERAL_WINDOWS_VM: mendimaru-github-hosted-ephemeral-vm
        run: |
          $installers = @(
            Get-ChildItem `
              "src-tauri/target/release/bundle/msi" `
              -Filter "*.msi" -File -ErrorAction Stop
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI installer."
          }
          ./scripts/e2e/windows-bundle-smoke.ps1 `
            -InstallerKind msi `
            -InstallerPath $installers[0].FullName `
            -Performance

      - name: Install, launch, and uninstall NSIS in the ephemeral VM
        shell: pwsh
        env:
          MENDIMARU_EPHEMERAL_WINDOWS_VM: mendimaru-github-hosted-ephemeral-vm
        run: |
          $installers = @(
            Get-ChildItem `
              "src-tauri/target/release/bundle/nsis" `
              -Filter "*.exe" -File -ErrorAction Stop
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer."
          }
          ./scripts/e2e/windows-bundle-smoke.ps1 `
            -InstallerKind nsis `
            -InstallerPath $installers[0].FullName `
            -Performance

      - name: Validate release bundle performance reports and budgets
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Release checkout did not resolve to a full Git commit.'
          }
          $artifactRoot = 'artifacts/e2e/release-performance'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          foreach ($kind in @('msi', 'nsis')) {
            $raw = "artifacts/bundle-smoke/$kind.json"
            $report = "$artifactRoot/release-$kind.json"
            node scripts/perf/bundle-report.mjs `
              --raw $raw `
              --output $report `
              --commit $commit `
              --baseline-commit $commit `
              --run-id "$env:GITHUB_RUN_ID-release-$kind"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to normalize the release $kind report."
            }
            node scripts/perf/performance-gate.mjs $report $report
            if ($LASTEXITCODE -ne 0) {
              throw "Release $kind exceeded an absolute performance budget."
            }
          }

      - name: Upload bundle smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-release-windows-bundle-smoke
          path: |
            artifacts/bundle-smoke
            artifacts/e2e/release-performance
          if-no-files-found: warn

      - name: Upload installers to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          )
          if ($installers.Count -lt 2) {
            throw "Expected both MSI and NSIS release installers."
          }
          foreach ($installer in $installers) {
            gh release upload $env:RELEASE_TAG $installer.FullName `
              --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $($installer.Name) to the release."
            }
          }

          if ($env:WINDOWS_SIGNING_ENABLED -eq "false") {
            gh release upload `
              $env:RELEASE_TAG `
              $env:WINDOWS_UNSIGNED_NOTICE_PATH `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload the unsigned-build notice."
            }

            $marker = "<!-- mendimaru-unsigned-windows-builds -->"
            $body = (
              gh release view `
                $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --json body `
                --jq .body |
                Out-String
            ).TrimEnd()
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to read the current GitHub release notes."
            }
            if (-not $body.Contains($marker)) {
              $notesPath = Join-Path `
                $env:RUNNER_TEMP `
                "mendimaru-release-notes.md"
              $warning = @"
          $marker
          ## Windows installer signing notice

          The MSI and NSIS installers attached to this release are **not
          Authenticode signed**. Windows SmartScreen may show an
          unknown-publisher warning. The installers were built by this
          repository's GitHub Actions workflow and passed the isolated
          install, launch, performance, and uninstall lifecycle checks.
          "@
              "$body`n`n$warning" |
                Set-Content -LiteralPath $notesPath -Encoding utf8
              gh release edit `
                $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --notes-file $notesPath
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to add the unsigned-build warning to the release."
              }
            }
          }

      - name: Remove temporary Windows signing material
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MENDIMARU_WINDOWS_IMPORTED_THUMBPRINTS)) {
            foreach ($thumbprint in ($env:MENDIMARU_WINDOWS_IMPORTED_THUMBPRINTS -split ',')) {
              if ($thumbprint -match '^[0-9A-Fa-f]+$') {
                Remove-Item `
                  -LiteralPath "Cert:\CurrentUser\My\$thumbprint" `
                  -Force -ErrorAction SilentlyContinue
              }
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:MENDIMARU_WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item `
              -LiteralPath $env:MENDIMARU_WINDOWS_CERTIFICATE_PATH `
              -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_WINDOWS_SIGNING_CONFIG)) {
            Remove-Item `
              -LiteralPath $env:TAURI_WINDOWS_SIGNING_CONFIG `
              -Force -ErrorAction SilentlyContinue
          }
