name: Release performance

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-webview-measure:
    name: Measure WebView (${{ matrix.platform }} / ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows
        variant:
          - baseline
          - candidate
        include:
          - platform: linux
            runner: ubuntu-latest
            package-kind: appimage
          - platform: windows
            runner: windows-latest
            package-kind: release-executable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve measured revisions
        id: revisions
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          candidate="$(git rev-parse HEAD)"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            baseline="$PULL_REQUEST_BASE_SHA"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Decide whether measured artifacts can change
        id: relevance
        shell: bash
        run: |
          relevant=false
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            relevant=true
          else
            base="${{ steps.revisions.outputs.baseline }}"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch origin "$base" --depth=1
            fi
            if git diff --name-only "$base" HEAD -- \
              'src-tauri' 'src' 'scripts' 'tests' 'performance' \
              'package.json' 'package-lock.json' 'vite.config.ts' \
              'tsconfig.json' 'tsconfig.node.json' 'index.html' \
              '.github/workflows/release-performance.yml' | grep -q .; then
              relevant=true
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Measured-artifact relevance: $relevant"

      - name: Check out current-main baseline
        if: matrix.variant == 'baseline' && steps.relevance.outputs.relevant == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revisions.outputs.baseline }}
          path: baseline-source

      - name: Backport test-only fixture hooks for the bootstrap baseline
        if: matrix.variant == 'baseline' && steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          if ! grep -q MENDIMARU_E2E_MARKETPLACE_URL \
            baseline-source/src-tauri/src/marketplace/browser.rs; then
            cp src-tauri/src/marketplace/browser.rs \
              baseline-source/src-tauri/src/marketplace/browser.rs
            cp src-tauri/src/marketplace/browser/session.rs \
              baseline-source/src-tauri/src/marketplace/browser/session.rs
          fi
          if ! grep -q delay_environment_status_for_performance \
            baseline-source/src-tauri/src/e2e.rs; then
            cp src-tauri/src/e2e.rs baseline-source/src-tauri/src/e2e.rs
            cp src-tauri/src/commands/environment.rs \
              baseline-source/src-tauri/src/commands/environment.rs
          fi

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            at-spi2-core \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Set up Node.js
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        if: steps.relevance.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust release build
        if: steps.relevance.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.variant == 'baseline' && 'baseline-source/src-tauri' || 'src-tauri' }}
          shared-key: release-performance-${{ matrix.platform }}-${{ matrix.variant }}

      - name: Install candidate dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: npm ci

      - name: Install baseline dependencies
        if: matrix.variant == 'baseline' && steps.relevance.outputs.relevant == 'true'
        working-directory: baseline-source
        run: npm ci

      - name: Cache pinned Tauri WebDriver bridge
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/.crates.json
            ~/.cargo/.crates.toml
          key: tauri-driver-2.0.6-x86_64-unknown-linux-gnu

      - name: Install pinned Tauri WebDriver bridge
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Build Linux AppImage
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        working-directory: ${{ matrix.variant == 'baseline' && 'baseline-source' || '.' }}
        run: >-
          npm run tauri -- build --bundles appimage --features e2e
          --config src-tauri/tauri.e2e.conf.json

      - name: Build Windows release executable
        if: runner.os == 'Windows' && steps.relevance.outputs.relevant == 'true'
        working-directory: ${{ matrix.variant == 'baseline' && 'baseline-source' || '.' }}
        run: >-
          npm run tauri -- build --no-bundle --features e2e
          --config src-tauri/tauri.e2e.conf.json

      - name: Measure the Linux AppImage
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        shell: bash
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          mkdir -p artifacts/e2e/release-performance
          sampling_args=()
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            sampling_args+=(--sample-count 5 --idle-window-seconds 300)
          fi
          chrome_path=""
          for command_name in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$command_name" >/dev/null 2>&1; then
              chrome_path="$(command -v "$command_name")"
              break
            fi
          done
          test -x "$chrome_path"
          export MENDIMARU_CHROME_PATH="$chrome_path"
          if [[ "${{ matrix.variant }}" == "baseline" ]]; then
            root="baseline-source"
            commit="${{ steps.revisions.outputs.baseline }}"
          else
            root="."
            commit="${{ steps.revisions.outputs.candidate }}"
          fi
          mapfile -t application < <(
            find "$root/src-tauri/target/release/bundle/appimage" \
              -maxdepth 1 -type f -name '*.AppImage'
          )
          [[ ${#application[@]} -eq 1 ]]
          xvfb-run --auto-servernum node scripts/perf/release-webview.mjs \
            --application "${application[0]}" \
            --report "artifacts/e2e/release-performance/${{ matrix.platform }}-${{ matrix.variant }}.json" \
            --commit "$commit" \
            --baseline-commit "${{ steps.revisions.outputs.baseline }}" \
            --package-kind ${{ matrix.package-kind }} \
            --run-id "${GITHUB_RUN_ID}-${{ matrix.variant }}" \
            "${sampling_args[@]}"

      - name: Measure the Windows executable
        if: runner.os == 'Windows' && steps.relevance.outputs.relevant == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory `
            -Path artifacts/e2e/release-performance `
            -Force | Out-Null
          $root = if ('${{ matrix.variant }}' -eq 'baseline') {
            'baseline-source'
          } else {
            '.'
          }
          $application = Join-Path $root 'src-tauri/target/release/mendimaru.exe'
          $commit = '${{ steps.revisions.outputs.baseline }}'
          if ('${{ matrix.variant }}' -eq 'candidate') {
            $commit = '${{ steps.revisions.outputs.candidate }}'
          }
          node scripts/perf/release-webview.mjs `
            --application $application `
            --report "artifacts/e2e/release-performance/${{ matrix.platform }}-${{ matrix.variant }}.json" `
            --commit $commit `
            --baseline-commit '${{ steps.revisions.outputs.baseline }}' `
            --package-kind ${{ matrix.package-kind }} `
            --run-id "$env:GITHUB_RUN_ID-${{ matrix.variant }}"
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows ${{ matrix.variant }} measurement failed.'
          }

      - name: Record skipped measurement
        if: steps.relevance.outputs.relevant != 'true'
        shell: bash
        run: |
          mkdir -p artifacts/e2e/release-performance
          {
            echo "release-performance: measurement skipped"
            echo "no measured-artifact paths changed since ${{ steps.revisions.outputs.baseline }}"
          } > artifacts/e2e/release-performance/skip-reason.txt

      - name: Upload the measurement report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webview-report-${{ matrix.platform }}-${{ matrix.variant }}
          path: artifacts/e2e/release-performance
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 90 }}

  release-webview-gate:
    name: Release WebView (${{ matrix.platform }})
    needs: release-webview-measure
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Download measurement reports
        uses: actions/download-artifact@v7
        with:
          pattern: webview-report-${{ matrix.platform }}-*
          merge-multiple: true
          path: reports

      - name: Apply absolute and current-main regression budgets
        shell: bash
        run: |
          if [[ -f reports/skip-reason.txt ]]; then
            echo "Measurement skipped for this push:"
            cat reports/skip-reason.txt
            exit 0
          fi
          node scripts/perf/performance-gate.mjs \
            "reports/${{ matrix.platform }}-candidate.json" \
            "reports/${{ matrix.platform }}-baseline.json"

  installed-bundle-measure:
    name: Measure installed bundles (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - candidate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve measured revisions
        id: revisions
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          candidate="$(git rev-parse HEAD)"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            baseline="$PULL_REQUEST_BASE_SHA"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Decide whether measured artifacts can change
        id: relevance
        shell: bash
        run: |
          relevant=false
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            relevant=true
          else
            base="${{ steps.revisions.outputs.baseline }}"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch origin "$base" --depth=1
            fi
            if git diff --name-only "$base" HEAD -- \
              'src-tauri' 'src' 'scripts' 'tests' 'performance' \
              'package.json' 'package-lock.json' 'vite.config.ts' \
              'tsconfig.json' 'tsconfig.node.json' 'index.html' \
              '.github/workflows/release-performance.yml' | grep -q .; then
              relevant=true
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Measured-artifact relevance: $relevant"

      - name: Check out current-main baseline
        if: matrix.variant == 'baseline' && steps.relevance.outputs.relevant == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revisions.outputs.baseline }}
          path: baseline-source

      - name: Set up Node.js
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        if: steps.relevance.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust bundle build
        if: steps.relevance.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.variant == 'baseline' && 'baseline-source/src-tauri' || 'src-tauri' }}
          shared-key: release-performance-windows-bundles-${{ matrix.variant }}

      - name: Install candidate dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: npm ci

      - name: Install baseline dependencies
        if: matrix.variant == 'baseline' && steps.relevance.outputs.relevant == 'true'
        working-directory: baseline-source
        run: npm ci

      - name: Build MSI and NSIS
        if: steps.relevance.outputs.relevant == 'true'
        working-directory: ${{ matrix.variant == 'baseline' && 'baseline-source' || '.' }}
        run: npm run tauri -- build --bundles msi,nsis

      - name: Stage installers under the guarded bundle root
        if: steps.relevance.outputs.relevant == 'true'
        shell: pwsh
        run: |
          $root = if ('${{ matrix.variant }}' -eq 'baseline') {
            'baseline-source'
          } else {
            '.'
          }
          $guarded = if ('${{ matrix.variant }}' -eq 'baseline') {
            'src-tauri/target/release/bundle/baseline'
          } else {
            'src-tauri/target/release/bundle'
          }
          foreach ($kind in @('msi', 'nsis')) {
            $filter = if ($kind -eq 'msi') { '*.msi' } else { '*.exe' }
            $source = @(
              Get-ChildItem "$root/src-tauri/target/release/bundle/$kind" `
                -Filter $filter -File -ErrorAction Stop
            )
            if ($source.Count -ne 1) {
              throw "Expected exactly one $kind installer for $root."
            }
            $destination = "$guarded/$kind"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item -LiteralPath $source[0].FullName -Destination $destination
          }

      - name: Measure the installed bundles
        if: steps.relevance.outputs.relevant == 'true'
        shell: pwsh
        env:
          MENDIMARU_EPHEMERAL_WINDOWS_VM: mendimaru-github-hosted-ephemeral-vm
        run: |
          $artifactRoot = 'artifacts/e2e/release-performance'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $commit = '${{ steps.revisions.outputs.baseline }}'
          if ('${{ matrix.variant }}' -eq 'candidate') {
            $commit = '${{ steps.revisions.outputs.candidate }}'
          }
          $guarded = if ('${{ matrix.variant }}' -eq 'baseline') {
            'src-tauri/target/release/bundle/baseline'
          } else {
            'src-tauri/target/release/bundle'
          }
          foreach ($kind in @('msi', 'nsis')) {
            $filter = if ($kind -eq 'msi') { '*.msi' } else { '*.exe' }
            $installers = @(
              Get-ChildItem "$guarded/$kind" `
                -Filter $filter -File -ErrorAction Stop
            )
            if ($installers.Count -ne 1) {
              throw "Expected exactly one staged $kind installer."
            }
            ./scripts/e2e/windows-bundle-smoke.ps1 `
              -InstallerKind $kind `
              -InstallerPath $installers[0].FullName `
              -Performance
            $raw = "artifacts/bundle-smoke/$kind.json"
            $rawCopy = "$artifactRoot/${{ matrix.variant }}-$kind.raw.json"
            $report = "$artifactRoot/${{ matrix.variant }}-$kind.json"
            Copy-Item -LiteralPath $raw -Destination $rawCopy -Force
            foreach ($suffix in @('install.log', 'uninstall.log')) {
              $log = "artifacts/bundle-smoke/$kind-$suffix"
              if (Test-Path -LiteralPath $log) {
                Copy-Item `
                  -LiteralPath $log `
                  -Destination "$artifactRoot/${{ matrix.variant }}-$kind-$suffix" `
                  -Force
              }
            }
            node scripts/perf/bundle-report.mjs `
              --raw $rawCopy `
              --output $report `
              --commit $commit `
              --baseline-commit '${{ steps.revisions.outputs.baseline }}' `
              --run-id "$env:GITHUB_RUN_ID-${{ matrix.variant }}-$kind"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to normalize ${{ matrix.variant }} $kind report."
            }
          }

      - name: Record skipped measurement
        if: steps.relevance.outputs.relevant != 'true'
        shell: bash
        run: |
          mkdir -p artifacts/e2e/release-performance
          {
            echo "release-performance: installed-bundle measurement skipped"
            echo "no measured-artifact paths changed since ${{ steps.revisions.outputs.baseline }}"
          } > artifacts/e2e/release-performance/skip-reason.txt

      - name: Upload the measurement reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-bundle-report-${{ matrix.variant }}
          path: artifacts/e2e/release-performance
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 90 }}

  installed-bundle-gate:
    name: Installed Windows bundle performance
    needs: installed-bundle-measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Download measurement reports
        uses: actions/download-artifact@v7
        with:
          pattern: installed-bundle-report-*
          merge-multiple: true
          path: reports

      - name: Gate MSI against current main
        shell: bash
        run: |
          if [[ -f reports/skip-reason.txt ]]; then
            echo "Measurement skipped for this push:"
            cat reports/skip-reason.txt
            exit 0
          fi
          node scripts/perf/performance-gate.mjs \
            reports/candidate-msi.json \
            reports/baseline-msi.json

      - name: Gate NSIS against current main
        shell: bash
        run: |
          if [[ -f reports/skip-reason.txt ]]; then
            exit 0
          fi
          node scripts/perf/performance-gate.mjs \
            reports/candidate-nsis.json \
            reports/baseline-nsis.json
