name: Release performance

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-webview-build:
    name: Build WebView binary (${{ matrix.platform }} / ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows
        variant:
          - baseline
          - candidate
        include:
          - platform: linux
            runner: ubuntu-latest
            package-kind: appimage
            build-recipe: >-
              build --bundles appimage --features e2e
              --config src-tauri/tauri.e2e.conf.json
          - platform: windows
            runner: windows-latest
            package-kind: release-executable
            build-recipe: >-
              build --no-bundle --features e2e
              --config src-tauri/tauri.e2e.conf.json
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve measured revisions
        id: revisions
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          candidate="$(git rev-parse HEAD)"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            baseline="$PULL_REQUEST_BASE_SHA"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Decide whether measured artifacts can change
        id: relevance
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Measured-artifact relevance: true (non-PR run)"
            exit 0
          fi
          base="${{ steps.revisions.outputs.baseline }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch origin "$base" --depth=1
          fi
          node scripts/perf/release-relevance.mjs \
            --base "$base" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"

      # Resolved before the binary cache so the toolchain identity can enter the
      # cache key. Without it a restored binary could have been compiled by a
      # different rustc than the variant it is compared against.
      - name: Set up Rust
        if: steps.relevance.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Fingerprint the build inputs
        id: fingerprint
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        env:
          BUILD_RECIPE: ${{ matrix.build-recipe }}
          MEASURED_COMMIT: ${{ matrix.variant == 'baseline' && steps.revisions.outputs.baseline || steps.revisions.outputs.candidate }}
        run: |
          if ! git cat-file -e "$MEASURED_COMMIT^{commit}" 2>/dev/null; then
            git fetch origin "$MEASURED_COMMIT" --depth=1
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            native_tools="$(
              ld --version
              cc --version
              ldd --version
            )"
            native_tools="${native_tools//$'\r'/ }"
            native_tools="${native_tools//$'\n'/ }"
          else
            native_tools="vs=${VisualStudioVersion:-unknown};vc=${VCToolsVersion:-unknown};sdk=${WindowsSDKVersion:-unknown}"
          fi
          node scripts/perf/build-fingerprint.mjs \
            --commit "$MEASURED_COMMIT" \
            --salt "recipe=$BUILD_RECIPE" \
            --salt "rustc=$(rustc --version --verbose | tr '\n' ' ')" \
            --salt "node=22.22.2" \
            --salt "runner=${{ matrix.runner }}" \
            --salt "runner-os=${ImageOS:-${RUNNER_OS:-unknown}}" \
            --salt "runner-arch=${RUNNER_ARCH:-unknown}" \
            --salt "native-tools=$native_tools" \
            --github-output "$GITHUB_OUTPUT"

      # Keyed by build-input content rather than by commit, so a revision that
      # only changes measurement code reuses an identical binary instead of
      # recompiling it. Both variants participate: the comparison is only valid
      # when baseline and candidate are equally fresh, and leaving the candidate
      # uncached kept a full release build on the critical path of every run.
      - name: Cache the built binary
        if: steps.relevance.outputs.relevant == 'true'
        id: binary-cache
        uses: actions/cache@v6
        with:
          path: cached-binary
          key: webview-binary-${{ matrix.platform }}-${{ steps.fingerprint.outputs.fingerprint }}

      - name: Check out current-main baseline
        if: matrix.variant == 'baseline' && steps.relevance.outputs.relevant == 'true' && steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revisions.outputs.baseline }}
          path: baseline-source

      - name: Backport test-only fixture hooks for the bootstrap baseline
        if: matrix.variant == 'baseline' && steps.relevance.outputs.relevant == 'true' && steps.binary-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! grep -q MENDIMARU_E2E_MARKETPLACE_URL \
            baseline-source/src-tauri/src/marketplace/browser.rs; then
            cp src-tauri/src/marketplace/browser.rs \
              baseline-source/src-tauri/src/marketplace/browser.rs
            cp src-tauri/src/marketplace/browser/session.rs \
              baseline-source/src-tauri/src/marketplace/browser/session.rs
          fi
          if ! grep -q delay_environment_status_for_performance \
            baseline-source/src-tauri/src/e2e.rs; then
            cp src-tauri/src/e2e.rs baseline-source/src-tauri/src/e2e.rs
            cp src-tauri/src/commands/environment.rs \
              baseline-source/src-tauri/src/commands/environment.rs
          fi

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true' && steps.binary-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            at-spi2-core \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Set up Node.js
        if: steps.relevance.outputs.relevant == 'true' && steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: ${{ matrix.variant == 'baseline' && 'baseline-source/package-lock.json' || 'package-lock.json' }}

      - name: Cache the Rust release build
        if: steps.relevance.outputs.relevant == 'true' && steps.binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.variant == 'baseline' && 'baseline-source/src-tauri' || 'src-tauri' }}
          shared-key: release-performance-${{ matrix.platform }}-${{ matrix.variant }}

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true' && steps.binary-cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.variant == 'baseline' && 'baseline-source' || '.' }}
        run: npm ci

      # One recipe per platform, shared with the fingerprint salt so a change to
      # the build flags cannot silently reuse a binary built by the old ones.
      - name: Build the measured binary
        if: steps.relevance.outputs.relevant == 'true' && steps.binary-cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.variant == 'baseline' && 'baseline-source' || '.' }}
        shell: bash
        run: npm run tauri -- ${{ matrix.build-recipe }}

      - name: Stage the binary for caching and artifact upload
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          mkdir -p staged-binary
          if [[ "${{ steps.binary-cache.outputs.cache-hit }}" == "true" ]]; then
            cp cached-binary/* staged-binary/
            exit 0
          fi
          root="."
          if [[ "${{ matrix.variant }}" == "baseline" ]]; then root="baseline-source"; fi
          mkdir -p cached-binary
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            mapfile -t app < <(find "$root/src-tauri/target/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage')
            [[ ${#app[@]} -eq 1 ]]
            cp "${app[0]}" staged-binary/
            cp "${app[0]}" cached-binary/
          else
            cp "$root/src-tauri/target/release/mendimaru.exe" staged-binary/
            cp "$root/src-tauri/target/release/mendimaru.exe" cached-binary/
          fi

      - name: Record skipped build
        if: steps.relevance.outputs.relevant != 'true'
        shell: bash
        run: |
          mkdir -p staged-binary
          echo "release-performance build skipped: no measured-artifact paths changed" \
            > staged-binary/skip-reason.txt

      - name: Publish the binary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webview-binary-${{ matrix.platform }}-${{ matrix.variant }}
          path: staged-binary
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  release-webview-measure:
    name: Measure WebView (${{ matrix.platform }} / ${{ matrix.variant }} / ${{ matrix.phase }})
    needs: release-webview-build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows
        variant:
          - baseline
          - candidate
        phase:
          - latency
          - idle
        exclude:
          # Latency compares both variants back to back on this one VM, so it
          # runs only from the candidate leg; idle stays per variant.
          - phase: latency
            variant: baseline
        include:
          - platform: linux
            runner: ubuntu-latest
            package-kind: appimage
          - platform: windows
            runner: windows-latest
            package-kind: release-executable
          - phase: latency
            # Baseline and candidate run back to back on this one VM so the
            # latency comparison keeps strict same-host compatibility.
            sample-count: 3
            idle-window-seconds: 5
          - phase: idle
            sample-count: 1
            idle-window-seconds: 300
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve measured revisions
        id: revisions
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          candidate="$(git rev-parse HEAD)"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            baseline="$PULL_REQUEST_BASE_SHA"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Decide whether measured artifacts can change
        id: relevance
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Measured-artifact relevance: true (non-PR run)"
            exit 0
          fi
          base="${{ steps.revisions.outputs.baseline }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch origin "$base" --depth=1
          fi
          node scripts/perf/release-relevance.mjs \
            --base "$base" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            at-spi2-core \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Set up Node.js
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: npm ci

      - name: Cache pinned Tauri WebDriver bridge
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/.crates.json
            ~/.cargo/.crates.toml
          key: tauri-driver-2.0.6-x86_64-unknown-linux-gnu

      - name: Install pinned Tauri WebDriver bridge
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Download the built binaries
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: webview-binary-${{ matrix.platform }}-*
          path: binary

      - name: Measure the Linux AppImage phase
        if: runner.os == 'Linux' && steps.relevance.outputs.relevant == 'true'
        shell: bash
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          mkdir -p artifacts/e2e/release-performance
          chrome_path=""
          for command_name in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$command_name" >/dev/null 2>&1; then
              chrome_path="$(command -v "$command_name")"
              break
            fi
          done
          test -x "$chrome_path"
          command -v dbus-run-session >/dev/null
          export MENDIMARU_CHROME_PATH="$chrome_path"
          variants=(${{ matrix.variant }})
          if [[ "${{ matrix.phase }}" == "latency" ]]; then variants=(baseline candidate); fi
          for variant in "${variants[@]}"; do
            application="$(find "binary/webview-binary-${{ matrix.platform }}-$variant" -maxdepth 1 -name '*.AppImage' -print -quit)"
            test -n "$application"
            chmod +x "$application"
            commit="${{ steps.revisions.outputs.baseline }}"
            if [[ "$variant" == "candidate" ]]; then
              commit="${{ steps.revisions.outputs.candidate }}"
            fi
            dbus-run-session -- xvfb-run --auto-servernum \
              node scripts/perf/release-webview.mjs \
              --application "$application" \
              --report "artifacts/e2e/release-performance/${{ matrix.platform }}-$variant-${{ matrix.phase }}.json" \
              --commit "$commit" \
              --baseline-commit "${{ steps.revisions.outputs.baseline }}" \
              --package-kind ${{ matrix.package-kind }} \
              --run-id "${GITHUB_RUN_ID}-$variant-${{ matrix.phase }}" \
              --sample-count ${{ matrix.sample-count }} \
              --idle-window-seconds ${{ matrix.idle-window-seconds }}
          done

      - name: Measure the Windows executable phase
        if: runner.os == 'Windows' && steps.relevance.outputs.relevant == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory `
            -Path artifacts/e2e/release-performance `
            -Force | Out-Null
          $variants = @('${{ matrix.variant }}')
          if ('${{ matrix.phase }}' -eq 'latency') { $variants = @('baseline', 'candidate') }
          foreach ($variant in $variants) {
            $application = Resolve-Path "binary/webview-binary-${{ matrix.platform }}-$variant/mendimaru.exe" `
              -ErrorAction Stop
            $commit = '${{ steps.revisions.outputs.baseline }}'
            if ($variant -eq 'candidate') {
              $commit = '${{ steps.revisions.outputs.candidate }}'
            }
            node scripts/perf/release-webview.mjs `
              --application $application `
              --report "artifacts/e2e/release-performance/${{ matrix.platform }}-$variant-${{ matrix.phase }}.json" `
              --commit $commit `
              --baseline-commit '${{ steps.revisions.outputs.baseline }}' `
              --package-kind release-executable `
              --run-id "$env:GITHUB_RUN_ID-$variant-${{ matrix.phase }}" `
              --sample-count ${{ matrix.sample-count }} `
              --idle-window-seconds ${{ matrix.idle-window-seconds }}
            if ($LASTEXITCODE -ne 0) {
              throw "Windows $variant ${{ matrix.phase }} measurement failed."
            }
          }

      - name: Record skipped measurement
        if: steps.relevance.outputs.relevant != 'true'
        shell: bash
        run: |
          mkdir -p artifacts/e2e/release-performance
          {
            echo "release-performance: measurement skipped"
            echo "no measured-artifact paths changed since ${{ steps.revisions.outputs.baseline }}"
          } > artifacts/e2e/release-performance/skip-reason.txt

      - name: Upload the measurement report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webview-report-${{ matrix.platform }}-${{ matrix.variant }}-${{ matrix.phase }}
          path: artifacts/e2e/release-performance
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 90 }}

  release-webview-gate:
    name: Release WebView (${{ matrix.platform }})
    needs: release-webview-measure
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve measured revisions
        id: revisions
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          candidate="$(git rev-parse HEAD)"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            baseline="$PULL_REQUEST_BASE_SHA"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Decide whether measured artifacts can change
        id: relevance
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Measured-artifact relevance: true (non-PR run)"
            exit 0
          fi
          base="${{ steps.revisions.outputs.baseline }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch origin "$base" --depth=1
          fi
          node scripts/perf/release-relevance.mjs \
            --base "$base" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: npm ci

      - name: Download measurement reports
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: webview-report-${{ matrix.platform }}-*
          merge-multiple: true
          path: reports

      - name: Gate the latency phase against current main
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          node scripts/perf/performance-gate.mjs \
            "reports/${{ matrix.platform }}-candidate-latency.json" \
            "reports/${{ matrix.platform }}-baseline-latency.json" \
            performance/budgets.latency.json

      - name: Gate the idle phase against current main
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          node scripts/perf/performance-gate.mjs \
            "reports/${{ matrix.platform }}-candidate-idle.json" \
            "reports/${{ matrix.platform }}-baseline-idle.json" \
            performance/budgets.idle.json

      - name: Record skipped gate
        if: steps.relevance.outputs.relevant != 'true'
        run: echo "Release WebView gate skipped because measured inputs are unchanged."

  installed-bundle-build:
    name: Build installers (${{ matrix.variant }})
    env:
      # Single source of truth: the fingerprint salt and the build command read
      # the same recipe, so changing the flags always changes the cache key.
      BUNDLE_BUILD_RECIPE: build --bundles msi,nsis
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve measured revisions
        id: revisions
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          candidate="$(git rev-parse HEAD)"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            baseline="$PULL_REQUEST_BASE_SHA"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Decide whether measured artifacts can change
        id: relevance
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Measured-artifact relevance: true (non-PR run)"
            exit 0
          fi
          base="${{ steps.revisions.outputs.baseline }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch origin "$base" --depth=1
          fi
          node scripts/perf/release-relevance.mjs \
            --base "$base" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.relevance.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Fingerprint the build inputs
        id: fingerprint
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        env:
          BUILD_RECIPE: ${{ env.BUNDLE_BUILD_RECIPE }}
          MEASURED_COMMIT: ${{ matrix.variant == 'baseline' && steps.revisions.outputs.baseline || steps.revisions.outputs.candidate }}
        run: |
          if ! git cat-file -e "$MEASURED_COMMIT^{commit}" 2>/dev/null; then
            git fetch origin "$MEASURED_COMMIT" --depth=1
          fi
          native_tools="vs=${VisualStudioVersion:-unknown};vc=${VCToolsVersion:-unknown};sdk=${WindowsSDKVersion:-unknown}"
          node scripts/perf/build-fingerprint.mjs \
            --commit "$MEASURED_COMMIT" \
            --salt "recipe=$BUILD_RECIPE" \
            --salt "rustc=$(rustc --version --verbose | tr '\n' ' ')" \
            --salt "node=22.22.2" \
            --salt "runner=windows-latest" \
            --salt "runner-os=${ImageOS:-${RUNNER_OS:-unknown}}" \
            --salt "runner-arch=${RUNNER_ARCH:-unknown}" \
            --salt "native-tools=$native_tools" \
            --github-output "$GITHUB_OUTPUT"

      # Same content-keyed reuse as the WebView binaries, for both variants.
      - name: Cache the built installers
        if: steps.relevance.outputs.relevant == 'true'
        id: installer-cache
        uses: actions/cache@v6
        with:
          path: staged-installers
          key: bundle-installers-${{ steps.fingerprint.outputs.fingerprint }}

      - name: Check out current-main baseline
        if: matrix.variant == 'baseline' && steps.relevance.outputs.relevant == 'true' && steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revisions.outputs.baseline }}
          path: baseline-source

      - name: Set up Node.js
        if: steps.relevance.outputs.relevant == 'true' && steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: ${{ matrix.variant == 'baseline' && 'baseline-source/package-lock.json' || 'package-lock.json' }}

      - name: Cache the Rust bundle build
        if: steps.relevance.outputs.relevant == 'true' && steps.installer-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.variant == 'baseline' && 'baseline-source/src-tauri' || 'src-tauri' }}
          shared-key: release-performance-windows-bundles-${{ matrix.variant }}

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true' && steps.installer-cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.variant == 'baseline' && 'baseline-source' || '.' }}
        run: npm ci

      - name: Build MSI and NSIS
        if: steps.relevance.outputs.relevant == 'true' && steps.installer-cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.variant == 'baseline' && 'baseline-source' || '.' }}
        shell: bash
        run: npm run tauri -- ${{ env.BUNDLE_BUILD_RECIPE }}

      - name: Stage the built installers
        if: steps.relevance.outputs.relevant == 'true' && steps.installer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $root = if ('${{ matrix.variant }}' -eq 'baseline') {
            'baseline-source'
          } else {
            '.'
          }
          New-Item -ItemType Directory -Path staged-installers -Force | Out-Null
          foreach ($kind in @('msi', 'nsis')) {
            $filter = if ($kind -eq 'msi') { '*.msi' } else { '*.exe' }
            $source = @(
              Get-ChildItem "$root/src-tauri/target/release/bundle/$kind" `
                -Filter $filter -File -ErrorAction Stop
            )
            if ($source.Count -ne 1) {
              throw "Expected exactly one $kind installer for $root."
            }
            Copy-Item -LiteralPath $source[0].FullName -Destination staged-installers
          }

      - name: Record skipped build
        if: steps.relevance.outputs.relevant != 'true'
        shell: bash
        run: |
          mkdir -p staged-installers
          echo "release-performance build skipped: no measured-artifact paths changed" \
            > staged-installers/skip-reason.txt

      - name: Publish the installer artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-installers-${{ matrix.variant }}
          path: staged-installers
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  installed-bundle-measure:
    name: Measure installed bundle (${{ matrix.variant }} / ${{ matrix.kind }})
    needs: installed-bundle-build
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - candidate
        kind:
          - msi
          - nsis
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve measured revisions
        id: revisions
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          candidate="$(git rev-parse HEAD)"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            baseline="$PULL_REQUEST_BASE_SHA"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Decide whether measured artifacts can change
        id: relevance
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Measured-artifact relevance: true (non-PR run)"
            exit 0
          fi
          base="${{ steps.revisions.outputs.baseline }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch origin "$base" --depth=1
          fi
          node scripts/perf/release-relevance.mjs \
            --base "$base" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: npm ci

      - name: Download the built installers
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/download-artifact@v7
        with:
          name: bundle-installers-${{ matrix.variant }}
          path: installers

      - name: Stage the installer under the guarded bundle root
        if: steps.relevance.outputs.relevant == 'true'
        shell: pwsh
        run: |
          $filter = if ('${{ matrix.kind }}' -eq 'msi') { '*.msi' } else { '*.exe' }
          $source = @(Get-ChildItem 'installers' -Filter $filter -File -ErrorAction Stop)
          if ($source.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.kind }} installer."
          }
          $destination = "src-tauri/target/release/bundle/${{ matrix.variant }}/${{ matrix.kind }}"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -LiteralPath $source[0].FullName -Destination $destination

      - name: Measure the installed bundle
        if: steps.relevance.outputs.relevant == 'true'
        shell: pwsh
        env:
          MENDIMARU_EPHEMERAL_WINDOWS_VM: mendimaru-github-hosted-ephemeral-vm
        run: |
          $artifactRoot = 'artifacts/e2e/release-performance'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $guarded = "src-tauri/target/release/bundle/${{ matrix.variant }}/${{ matrix.kind }}"
          $filter = if ('${{ matrix.kind }}' -eq 'msi') { '*.msi' } else { '*.exe' }
          $installers = @(
            Get-ChildItem $guarded -Filter $filter -File -ErrorAction Stop
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one staged ${{ matrix.kind }} installer."
          }
          $commit = '${{ steps.revisions.outputs.baseline }}'
          if ('${{ matrix.variant }}' -eq 'candidate') {
            $commit = '${{ steps.revisions.outputs.candidate }}'
          }
          ./scripts/e2e/windows-bundle-smoke.ps1 `
            -InstallerKind ${{ matrix.kind }} `
            -InstallerPath $installers[0].FullName `
            -Performance
          $raw = "artifacts/bundle-smoke/${{ matrix.kind }}.json"
          $rawCopy = "$artifactRoot/${{ matrix.variant }}-${{ matrix.kind }}.raw.json"
          $report = "$artifactRoot/${{ matrix.variant }}-${{ matrix.kind }}.json"
          Copy-Item -LiteralPath $raw -Destination $rawCopy -Force
          foreach ($suffix in @('install.log', 'uninstall.log')) {
            $log = "artifacts/bundle-smoke/${{ matrix.kind }}-$suffix"
            if (Test-Path -LiteralPath $log) {
              Copy-Item `
                -LiteralPath $log `
                -Destination "$artifactRoot/${{ matrix.variant }}-${{ matrix.kind }}-$suffix" `
                -Force
            }
          }
          node scripts/perf/bundle-report.mjs `
            --raw $rawCopy `
            --output $report `
            --commit $commit `
            --baseline-commit '${{ steps.revisions.outputs.baseline }}' `
            --run-id "$env:GITHUB_RUN_ID-${{ matrix.variant }}-${{ matrix.kind }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to normalize ${{ matrix.variant }} ${{ matrix.kind }} report."
          }

      - name: Record skipped measurement
        if: steps.relevance.outputs.relevant != 'true'
        shell: bash
        run: |
          mkdir -p artifacts/e2e/release-performance
          {
            echo "release-performance: installed-bundle measurement skipped"
            echo "no measured-artifact paths changed since ${{ steps.revisions.outputs.baseline }}"
          } > artifacts/e2e/release-performance/skip-reason.txt

      - name: Upload the measurement report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-bundle-report-${{ matrix.variant }}-${{ matrix.kind }}
          path: artifacts/e2e/release-performance
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 90 }}

  installed-bundle-gate:
    name: Installed Windows bundle performance
    needs: installed-bundle-measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve measured revisions
        id: revisions
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          candidate="$(git rev-parse HEAD)"
          if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
            baseline="$PULL_REQUEST_BASE_SHA"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Decide whether measured artifacts can change
        id: relevance
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Measured-artifact relevance: true (non-PR run)"
            exit 0
          fi
          base="${{ steps.revisions.outputs.baseline }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch origin "$base" --depth=1
          fi
          node scripts/perf/release-relevance.mjs \
            --base "$base" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: npm ci

      - name: Download measurement reports
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: installed-bundle-report-*
          merge-multiple: true
          path: reports

      - name: Gate MSI against current main
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          node scripts/perf/performance-gate.mjs \
            reports/candidate-msi.json \
            reports/baseline-msi.json \
            performance/budgets.bundle.json

      - name: Gate NSIS against current main
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        run: |
          node scripts/perf/performance-gate.mjs \
            reports/candidate-nsis.json \
            reports/baseline-nsis.json \
            performance/budgets.bundle.json

      - name: Record skipped gate
        if: steps.relevance.outputs.relevant != 'true'
        run: echo "Installed bundle gate skipped because measured inputs are unchanged."
