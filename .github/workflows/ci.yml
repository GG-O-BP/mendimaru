name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Relevance gating below can skip a gate on a pull request. This weekly run
  # exercises every gate against main regardless of what changed, so a path
  # contract that has drifted away from reality cannot hide indefinitely.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Decide which gates must run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aur: ${{ steps.filter.outputs.aur }}
      bundle: ${{ steps.filter.outputs.bundle }}
      windows_e2e: ${{ steps.filter.outputs.windows_e2e }}
      linux_e2e: ${{ steps.filter.outputs.linux_e2e }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Fail closed in every direction. A non-pull-request event, a missing or
      # unreachable base commit, a classifier crash, or an incomplete decision
      # all run every gate. Only a complete, successful classification can mark
      # a gate skippable, and the decision file is copied into the job outputs
      # in one step so a partial write can never be read as a full answer.
      - name: Classify which gates the change can affect
        id: filter
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gates=(aur bundle windows_e2e linux_e2e security)

          run_every_gate() {
            for gate in "${gates[@]}"; do
              echo "$gate=true" >> "$GITHUB_OUTPUT"
            done
            echo "CI gate relevance: every gate runs ($1)"
          }

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            run_every_gate "non-pull-request run"
            exit 0
          fi

          base="${PULL_REQUEST_BASE_SHA:-}"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            run_every_gate "no usable base commit"
            exit 0
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            run_every_gate "base commit $base is unreachable"
            exit 0
          fi

          decision="$(mktemp)"
          if ! node scripts/ci/gate-relevance.mjs \
            --base "$base" \
            --head HEAD \
            --github-output "$decision"; then
            run_every_gate "the classifier failed"
            exit 0
          fi
          for gate in "${gates[@]}"; do
            if ! grep -q "^$gate=" "$decision"; then
              run_every_gate "the classifier omitted $gate"
              exit 0
            fi
          done
          cat "$decision" >> "$GITHUB_OUTPUT"
          cat "$decision"

  aur-package:
    needs: changes
    if: needs.changes.outputs.aur == 'true'
    uses: ./.github/workflows/aur-package.yml

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting and lint
        run: |
          npm run format:check
          npm run lint:frontend

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit and mocked app-flow tests
        run: npm run test:frontend

      - name: Verify the animation lifecycle contract
        run: npm run test:motion

      - name: Test bounded browser artifact scanning
        run: npm run test:browser:security

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --nocapture --test-threads=1

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Windows test-feature clippy
        if: runner.os == 'Windows'
        run: npm run lint:rust:all-features

      - name: Test Windows bundle smoke helpers
        if: runner.os == 'Windows'
        run: npm run test:e2e:windows:powershell

  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            at-spi2-core \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Issue #209. This job used to keep its own 0.81 GiB dependency cache
      # under the job-derived key `v0-rust-test-ubuntu-*`, which was a second
      # copy of something `rust-ubuntu` already holds: run 35818611312 shows
      # both jobs compiling in the same `src-tauri` directory on identically configured
      # runners, resolving the same toolchain and lockfile hashes
      # (`6ff13d87-aea8b408`), and producing the same `-C metadata` hashes for
      # every target. `rust-ubuntu` builds `--all-targets`, so its entry is a
      # strict superset of what this job needs, and pointing both at one key
      # removes 0.81 GiB from the irreducible floor without costing a hit.
      #
      # The shared key is spelled with `rust-ubuntu`'s historical job name on
      # purpose: an identical key means the consolidation costs nobody a cold
      # generation on the merge that introduces it.
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ubuntu
          # Restore-only. With one key and two writers, whichever job finished
          # first would decide the contents for the whole generation, and this
          # job's narrower build would strand `rust-ubuntu` with a partial
          # cache until the next toolchain roll. One designated writer, the
          # one that builds the superset, keeps that deterministic.
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache pinned Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check frontend formatting and lint
        run: |
          npm run format:check
          npm run lint:frontend

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit and mocked app-flow tests
        run: npm run test:frontend

      - name: Verify the animation lifecycle contract
        run: npm run test:motion

      - name: Test bounded browser artifact scanning
        run: npm run test:browser:security

      # This job is never relevance-gated, so the contracts that decide whether
      # the gated jobs may be skipped are always verified on every run.
      - name: Test CI gate relevance and performance harness contracts
        run: |
          npm run test:ci:gates
          npm run test:perf

      - name: Run strict Playwright browser E2E
        run: |
          npm run test:browser
          npm run test:browser:winboat:helpers

      - name: Run sandboxed Marketplace Chromium security gate
        shell: bash
        run: |
          chrome_path="$(
            command -v google-chrome-stable || command -v google-chrome
          )"
          test -x "$chrome_path"
          MENDIMARU_CHROME_PATH="$chrome_path" \
            cargo test --manifest-path src-tauri/Cargo.toml \
              live_linux_marketplace_browser_security_gate -- \
              --ignored --nocapture --test-threads=1

      - name: Scrape the real Marketplace catalog with Linux Chromium
        shell: bash
        run: |
          chrome_path="$(
            command -v google-chrome-stable || command -v google-chrome
          )"
          test -x "$chrome_path"
          MENDIMARU_CHROME_PATH="$chrome_path" \
            cargo test --manifest-path src-tauri/Cargo.toml \
              live_scrapes_the_first_catalog_page -- \
              --ignored --nocapture --test-threads=1

  linux-webkit-e2e:
    name: Linux Tauri WebKit E2E
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: needs.changes.outputs.linux_e2e == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            at-spi2-core \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Set up Node.js
        if: needs.changes.outputs.linux_e2e == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        if: needs.changes.outputs.linux_e2e == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        if: needs.changes.outputs.linux_e2e == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        if: needs.changes.outputs.linux_e2e == 'true'
        run: npm ci

      - name: Cache pinned Tauri WebDriver bridge
        if: needs.changes.outputs.linux_e2e == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/.crates.json
            ~/.cargo/.crates.toml
          key: tauri-driver-2.0.6-x86_64-unknown-linux-gnu

      - name: Install pinned Tauri WebDriver bridge
        if: needs.changes.outputs.linux_e2e == 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Run real Tauri WebKit E2E
        if: needs.changes.outputs.linux_e2e == 'true'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Verify Linux and Windows E2E coverage levels
        if: needs.changes.outputs.linux_e2e == 'true'
        run: npm run test:e2e:coverage

      - name: Record skipped gate
        if: needs.changes.outputs.linux_e2e != 'true'
        run: >-
          echo "Linux WebKit E2E skipped: no application, packaged resource, or
          E2E harness path changed."

      - name: Upload Tauri WebKit E2E failure evidence
        if: always() && needs.changes.outputs.linux_e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-linux-e2e
          path: |
            artifacts/e2e/linux-tauri.json
            artifacts/e2e/linux-tauri*.png
            artifacts/e2e/e2e-coverage.json
            /tmp/mendimaru-tauri-e2e-*
          if-no-files-found: ignore

  rust-ubuntu:
    name: Rust tests and clippy (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            at-spi2-core \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      # Issue #209. The single writer of the Linux default-feature dependency
      # cache; `Test (ubuntu-latest)` restores this same entry read-only. The
      # key is pinned rather than left to the job id so that renaming this job
      # cannot silently split the family back in two and put 0.81 GiB back on
      # the floor. `--all-targets` below is what makes this entry the superset
      # the other job can live on.
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ubuntu

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache pinned Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --nocapture --test-threads=1

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  ui-helper-contract:
    name: Windows helper contract (no Studio)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test the production WinBoat helper under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-ui-helper.ps1
      - name: Test nested modal input guards
        shell: powershell
        run: ./scripts/test-ui-modal.ps1

      - name: Test bounded native Go To navigation
        shell: powershell
        run: ./scripts/test-ui-navigation.ps1

  security:
    name: Dependency security audit
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run dependency audit action
        if: needs.changes.outputs.security == 'true'
        uses: ./actions/dependency-audit

      - name: Record skipped gate
        if: needs.changes.outputs.security != 'true'
        run: >-
          echo "Dependency audit skipped: no npm or Cargo manifest, RustSec
          policy, or audit action path changed."

  windows-native-e2e:
    name: Actual Windows Tauri dev E2E
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: needs.changes.outputs.windows_e2e == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        if: needs.changes.outputs.windows_e2e == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        if: needs.changes.outputs.windows_e2e == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        if: needs.changes.outputs.windows_e2e == 'true'
        run: npm ci

      # The hosted image's default browser failed to publish its CDP endpoint
      # in attempt 2 of run 35962251877. Use the lockfile-pinned Chromium for
      # the external catalog, as Linux does, while the app still uses WebView2.
      # Do not add an Actions cache family: this browser is installed per job.
      - name: Install pinned Marketplace Chromium
        if: needs.changes.outputs.windows_e2e == 'true'
        shell: pwsh
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Pinned Chromium installation failed." }
          $chromePath = node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath());"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $chromePath -PathType Leaf)) {
            throw "Pinned Chromium executable was not found."
          }
          "MENDIMARU_CHROME_PATH=$chromePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run actual Tauri, WebView2, IPC, Windows, and performance E2E
        if: needs.changes.outputs.windows_e2e == 'true'
        run: npm run test:e2e:windows
        env:
          MENDIMARU_E2E_MAX_STARTUP_MS: 180000

      - name: Record skipped gate
        if: needs.changes.outputs.windows_e2e != 'true'
        run: >-
          echo "Windows native E2E skipped: no application, packaged resource,
          or E2E harness path changed."

      - name: Upload native E2E diagnostics
        if: always() && needs.changes.outputs.windows_e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-windows-native-e2e
          path: artifacts/e2e
          if-no-files-found: error

  windows-bundle:
    name: Build, install, launch, and uninstall Windows bundles
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: needs.changes.outputs.bundle == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        if: needs.changes.outputs.bundle == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        if: needs.changes.outputs.bundle == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        if: needs.changes.outputs.bundle == 'true'
        run: npm ci

      - name: Build MSI and NSIS bundles
        if: needs.changes.outputs.bundle == 'true'
        run: npm run tauri -- build --bundles msi,nsis

      - name: Verify installer outputs
        if: needs.changes.outputs.bundle == 'true'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File)) {
            throw "MSI installer was not generated."
          }
          if (-not (Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)) {
            throw "NSIS installer was not generated."
          }

      - name: Install, launch, and uninstall MSI in the ephemeral VM
        if: needs.changes.outputs.bundle == 'true'
        shell: pwsh
        env:
          MENDIMARU_EPHEMERAL_WINDOWS_VM: mendimaru-github-hosted-ephemeral-vm
        run: |
          $installers = @(
            Get-ChildItem `
              "src-tauri/target/release/bundle/msi" `
              -Filter "*.msi" -File -ErrorAction Stop
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI installer."
          }
          ./scripts/e2e/windows-bundle-smoke.ps1 `
            -InstallerKind msi `
            -InstallerPath $installers[0].FullName

      - name: Install, launch, and uninstall NSIS in the ephemeral VM
        if: needs.changes.outputs.bundle == 'true'
        shell: pwsh
        env:
          MENDIMARU_EPHEMERAL_WINDOWS_VM: mendimaru-github-hosted-ephemeral-vm
        run: |
          $installers = @(
            Get-ChildItem `
              "src-tauri/target/release/bundle/nsis" `
              -Filter "*.exe" -File -ErrorAction Stop
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer."
          }
          ./scripts/e2e/windows-bundle-smoke.ps1 `
            -InstallerKind nsis `
            -InstallerPath $installers[0].FullName

      - name: Record skipped gate
        if: needs.changes.outputs.bundle != 'true'
        run: >-
          echo "Windows bundle gate skipped: no application, packaged resource,
          or bundle smoke harness path changed."

      - name: Upload bundle smoke diagnostics
        if: always() && needs.changes.outputs.bundle == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-windows-bundle-smoke
          path: artifacts/bundle-smoke
          if-no-files-found: warn

      - name: Upload Windows smoke artifacts
        if: needs.changes.outputs.bundle == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Counterpart to post-merge-regression-report in release-performance.yml.
  # The issue #176 split SLA moved idle and installed-bundle detection past the
  # merge point; without a hold, a regression found after merge would not stop
  # further commits from stacking on top of it.
  #
  # Deliberately ungated and dependency-free: it is one API call, so it cannot
  # meaningfully affect the pull-request wall clock this split SLA protects.
  perf-regression-hold:
    name: Post-merge performance hold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Fails closed: an unreadable query result is reported as red rather than
      # silently read as "main is healthy".
      - name: Hold merges while a post-merge performance regression is open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list \
            --label "ci:perf-regression" \
            --label "revert-candidate" \
            --state open \
            --limit 1000 \
            --json number,title,url,state,labels > open-issues.json
          node scripts/ci/regression-hold.mjs < open-issues.json
