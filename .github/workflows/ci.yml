name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting and lint
        run: |
          npm run format:check
          npm run lint:frontend

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit and mocked UI integration tests
        run: npm run test:frontend

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependency tree
        run: npm audit --audit-level=high

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependency lockfile
        run: cargo audit --file src-tauri/Cargo.lock

  windows-native-e2e:
    name: Actual Windows Tauri dev E2E
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run actual Tauri, WebView2, IPC, Windows, and performance E2E
        run: npm run test:e2e
        env:
          MENDIMARU_E2E_MAX_STARTUP_MS: 180000

      - name: Upload native E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-windows-native-e2e
          path: artifacts/e2e
          if-no-files-found: error

  windows-bundle:
    name: Build, install, launch, and uninstall Windows bundles
    needs:
      - security
      - windows-native-e2e
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MSI and NSIS bundles
        run: npm run tauri -- build --bundles msi,nsis

      - name: Verify installer outputs
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File)) {
            throw "MSI installer was not generated."
          }
          if (-not (Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)) {
            throw "NSIS installer was not generated."
          }

      - name: Install, launch, and uninstall MSI in the ephemeral VM
        shell: pwsh
        env:
          MENDIMARU_EPHEMERAL_WINDOWS_VM: mendimaru-github-hosted-ephemeral-vm
        run: |
          $installers = @(
            Get-ChildItem `
              "src-tauri/target/release/bundle/msi" `
              -Filter "*.msi" -File -ErrorAction Stop
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI installer."
          }
          ./scripts/e2e/windows-bundle-smoke.ps1 `
            -InstallerKind msi `
            -InstallerPath $installers[0].FullName

      - name: Install, launch, and uninstall NSIS in the ephemeral VM
        shell: pwsh
        env:
          MENDIMARU_EPHEMERAL_WINDOWS_VM: mendimaru-github-hosted-ephemeral-vm
        run: |
          $installers = @(
            Get-ChildItem `
              "src-tauri/target/release/bundle/nsis" `
              -Filter "*.exe" -File -ErrorAction Stop
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer."
          }
          ./scripts/e2e/windows-bundle-smoke.ps1 `
            -InstallerKind nsis `
            -InstallerPath $installers[0].FullName

      - name: Upload bundle smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-windows-bundle-smoke
          path: artifacts/bundle-smoke
          if-no-files-found: warn

      - name: Upload Windows smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mendimaru-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
